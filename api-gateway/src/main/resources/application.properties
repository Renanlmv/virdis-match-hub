spring.application.name=api-gateway

# Porta obrigatoria do API Gateway
server.port=8082


# Configuracao do Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Identificador da instancia no Eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}


# Cria rotas automaticamente para os servicos registrados no Eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# Permite utilizar os nomes dos servicos em letras minusculas nas URLs
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true