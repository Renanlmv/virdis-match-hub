services:

  mysqldb:
    container_name: virdis-mysql
    image: mysql:8.4.6

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - virdis_mysql_data:/var/lib/mysql

    networks:
      - virdis-net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  eureka-server:
    container_name: virdis-eureka-server
    image: virdis-eureka-server

    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    ports:
      - "8761:8761"

    networks:
      - virdis-net


  api-gateway:
    container_name: virdis-api-gateway
    image: virdis-api-gateway

    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway

    ports:
      - "8082:8082"

    depends_on:
      eureka-server:
        condition: service_started

    networks:
      - virdis-net


  ms-space:
    container_name: virdis-ms-space
    image: virdis-ms-space

    build:
      context: ./ms-space
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/virdis_space_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-space

    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - virdis-net


  ms-project:
    container_name: virdis-ms-project
    image: virdis-ms-project

    build:
      context: ./ms-project
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/virdis_project_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-project

    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-space:
        condition: service_started

    networks:
      - virdis-net


volumes:
  virdis_mysql_data:
    name: virdis_mysql_data


networks:
  virdis-net:
    name: virdis-net