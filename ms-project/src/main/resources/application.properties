spring.application.name=ms-project

# Profile ativo para execucao local com H2
spring.profiles.active=test

# Flyway sera utilizado no profile dev com MySQL
spring.flyway.enabled=false

# Evita consultas ao banco durante a serializacao das respostas
spring.jpa.open-in-view=false


# Porta aleatoria para permitir multiplas instancias
server.port=0


# Configuracao do Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Identificador unico da instancia no Eureka
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]]}


# Configuracao do Circuit Breaker utilizado pelo SpaceIntegrationService
resilience4j.circuitbreaker.instances.spaceService.register-health-indicator=true
resilience4j.circuitbreaker.instances.spaceService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.spaceService.sliding-window-size=5
resilience4j.circuitbreaker.instances.spaceService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.spaceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.spaceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.spaceService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.spaceService.automatic-transition-from-open-to-half-open-enabled=true