# Exibe as mensagens de erro durante os testes locais
server.error.include-message=always

# Nao exibe o stack trace nas respostas
server.error.include-stacktrace=never


# Conexao com o banco H2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:projectdb
spring.datasource.username=sa
spring.datasource.password=


# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Flyway sera utilizado somente no profile dev com MySQL
spring.flyway.enabled=false